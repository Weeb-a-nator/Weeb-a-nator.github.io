<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weeb-a-nator Projects</title>
    <style>
      :root {
        --background: #eef8ff;
        --panel: #ffffff;
        --border: #c9e3f5;
        --accent: #3d8fc2;
        --accent-dark: #1f638f;
        --text: #183247;
        --muted: #58758a;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Arial, sans-serif;
        color: var(--text);
        background: linear-gradient(180deg, #eaf7ff 0%, #ffffff 100%);
      }

      main {
        width: min(100%, 640px);
        padding: 40px;
        text-align: center;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(23, 43, 26, 0.08);
      }

      h1 {
        margin: 0 0 12px;
        color: var(--accent-dark);
      }

      p {
        margin: 0 0 28px;
        color: var(--muted);
        line-height: 1.5;
      }

      a {
        display: inline-block;
        padding: 12px 18px;
        color: #ffffff;
        background: var(--accent);
        border-radius: 8px;
        font-weight: 700;
        text-decoration: none;
      }

      a:hover { background: var(--accent-dark); }

      .project-links {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      footer {
        position: fixed;
        right: 0;
        bottom: 16px;
        left: 0;
        text-align: center;
        color: var(--muted);
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Weeb-a-nator Projects</h1>
      <p>A collection of projects by Weeb-a-nator.</p>
      <div class="project-links">
        <a href="stableford-score-calculator.html">Stableford Score Calculator</a>
        <a href="https://github.com/Weeb-a-nator">View GitHub projects</a>
      </div>
    </main>

    <footer>Created by Weeb-a-nator</footer>
  </body>
</html>
